# RSS/Atom sources the LLM reads for security news. Add/remove freely - no code changes needed.
# CVEs themselves come from CISA KEV and NVD (see stack.yaml / advisories.py) with fixed rules, so
# these feeds are for what those can't give: early warnings, pre-announced security releases, and
# exploitation news before a CVE is scored. Each feed's last fetch result is shown on the page.
#
# Microsoft (MSRC) and Ubuntu (USN) feeds are deliberately not here: Microsoft CVEs reach NVD with
# Microsoft's own CVSS on release day and are scored by fixed rules, and USNs are one item per
# package update with no severity - they'd mostly add orange noise. Add them if you want them:
#   https://api.msrc.microsoft.com/update-guide/rss
#   https://ubuntu.com/security/notices/rss.xml
#
# "reddit" is one combined multireddit feed, not one entry per subreddit - Reddit's anonymous access
# is tight enough that a second request right after the first gets blocked (429, or on old.reddit.com
# a redirect to a login wall), so it's fetched on its own separate clock (REDDIT_POLL_HOURS, see
# config.py/feeds.fetch_reddit()) rather than every poll. Stick to www.reddit.com specifically - a
# lone request there has reliably succeeded in testing, old.reddit.com has not. feeds.py re-derives
# the real per-item subreddit from each entry's own link, so cards/columns still show the correct
# r/name despite it being one combined request. `limit` (optional, defaults to MAX_ITEMS_PER_SOURCE)
# raises the cap for this combined feed so quieter subreddits still get a fair share of the shared
# pool of items - Reddit's RSS endpoint appears to cap actual results at 25 regardless.
reddit:
  - name: Reddit (combined)
    url: https://www.reddit.com/r/sysadmin+netsec/new/.rss
    limit: 100

vendor_advisories:
  # Pre-announces security releases about a week ahead, with their severity.
  - name: Node.js Security
    url: https://nodejs.org/en/feed/vulnerability.xml
  - name: PHP News
    url: https://www.php.net/feed.atom
  # Oracle Critical Patch Updates and Security Alerts (Java SE).
  - name: Oracle Security Alerts
    url: https://www.oracle.com/ocom/groups/public/@otn/documents/webcontent/rss-otn-sec.xml
  - name: Grafana Blog
    url: https://grafana.com/blog/index.xml
  - name: CISA Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml

security_news:
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
  - name: SANS Internet Storm Center
    url: https://isc.sans.edu/rssfeed_full.xml
  - name: The Register
    url: https://www.theregister.com/headlines.atom
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
  - name: Hacker News (front page)
    url: https://hnrss.org/frontpage
