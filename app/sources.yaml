# RSS/Atom sources to poll. Add/remove freely - no code changes needed.
# "reddit" is one combined multireddit feed, not one entry per subreddit - Reddit's anonymous access
# is tight enough that a second request right after the first gets blocked (429, or on old.reddit.com
# a redirect to a login wall), so it's fetched on its own separate clock (REDDIT_POLL_HOURS, see
# config.py/feeds.fetch_reddit()) rather than every poll. Stick to www.reddit.com specifically - a
# lone request there has reliably succeeded in testing, old.reddit.com has not. feeds.py re-derives
# the real per-item subreddit from each entry's own link, so cards/columns still show the correct
# r/name despite it being one combined request. `limit` (optional, defaults to MAX_ITEMS_PER_SOURCE)
# raises the cap for this combined feed so quieter subreddits still get a fair share of the shared
# pool of items - Reddit's RSS endpoint appears to cap actual results at 25 regardless.
reddit:
  - name: Reddit (combined)
    url: https://www.reddit.com/r/homelab+selfhosted+docker+devops+kubernetes+sysadmin/new/.rss
    limit: 100

hackernews:
  - name: Hacker News (front page)
    url: https://hnrss.org/frontpage
  - name: Hacker News (newest)
    url: https://hnrss.org/newest?points=30

blogs:
  - name: ServeTheHome
    url: https://www.servethehome.com/feed/
  - name: Docker Blog
    url: https://www.docker.com/blog/feed/
  - name: Kubernetes Blog
    url: https://kubernetes.io/feed.xml
  - name: Cloudflare Blog
    url: https://blog.cloudflare.com/rss/
  - name: Grafana Blog
    url: https://grafana.com/blog/index.xml
  - name: Phoronix
    url: https://www.phoronix.com/rss.php

it_news:
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
  - name: The Register
    url: https://www.theregister.com/headlines.atom
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
  - name: SANS Internet Storm Center
    url: https://isc.sans.edu/rssfeed_full.xml
  - name: Microsoft Security Blog
    url: https://www.microsoft.com/en-us/security/blog/feed/
