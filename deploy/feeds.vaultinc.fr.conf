# Reverse-proxy vhost for feeds.vaultinc.fr, to be placed on the nginx LXC (192.168.1.170).
# Backend: devops-feed-curator container on the docker LXC (192.168.1.192:8085).
#
# This is the pre-certbot version (HTTP only, port 80). Run certbot --nginx against it
# (see deploy/README.md) and it will rewrite this file in place to add the 443/TLS block
# and the http->https redirect, same as the other *.vaultinc.fr vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name feeds.vaultinc.fr;

    location / {
        proxy_pass http://192.168.1.192:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
