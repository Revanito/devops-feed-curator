services:
  feed-curator:
    build: ./app
    container_name: devops-feed-curator
    ports:
      - "8085:8000"
    volumes:
      - ./data:/data
      - ./app/sources.yaml:/app/sources.yaml
      - ./app/deals.yaml:/app/deals.yaml
      - ./app/prompts:/app/prompts
    env_file:
      - .env
    restart: unless-stopped
